<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Landscapes Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
  :root { --green: #2f6b3a; --green-dark: #1f4a27; --ink: #23302a; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; }
  .wrap { display: flex; flex-direction: column; height: 100%; }
  .bar { padding: 10px 14px; font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
  .bar strong { color: var(--green-dark); font-size: 18px; }
  .bar .muted { color: #667; font-size: 13px; }
  #map { flex: 1; min-height: 320px; }
  .pin { position: relative; width: 30px; height: 40px; }
  .pin svg { width: 30px; height: 40px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .pin span { position: absolute; top: 6px; left: 0; width: 30px; text-align: center; color: #fff; font: 700 12px/16px system-ui, sans-serif; }
  .pin.group, .pin.group svg { width: 38px; height: 50px; }
  .pin.group span { width: 38px; top: 9px; font-size: 13px; }
  .leaflet-popup-content { font-size: 14px; margin: 10px 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="summary">Loading map…</div>
  <div id="map" role="region" aria-label="Map of Living Landscapes participants by zip code"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
  // "Living Landscapes Map Data" Apps Script web app (returns zip codes + counts only).
  const DATA_URL = 'https://script.google.com/macros/s/AKfycbzNRVpIVuUUhevC4PAbunClFghPXPd8ieRP3j7_ySdxjh-ngUaojjq5pTH5xZtrtwM7/exec';

  const FLORIDA = [[24.4, -87.7], [31.05, -79.9]];
  const map = L.map('map', { scrollWheelZoom: false, maxBounds: [[22.5, -90], [33, -77]], minZoom: 6 });
  map.fitBounds(FLORIDA);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 13,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  // Let people scroll the page past the map; zoom with the buttons, or click the map first.
  map.on('click', () => map.scrollWheelZoom.enable());
  map.on('mouseout', () => map.scrollWheelZoom.disable());

  // A single zip is a green pin; a group of nearby zips is a larger, darker pin with the combined total.
  function pinIcon(count, group) {
    const w = group ? 38 : 30, h = group ? 50 : 40;
    const label = count > 999 ? '999+' : count;
    return L.divIcon({
      className: '',
      iconSize: [w, h], iconAnchor: [w / 2, h], popupAnchor: [0, -h + 4],
      html: '<div class="pin' + (group ? ' group' : '') + '"><svg viewBox="0 0 30 40"><path fill="' + (group ? '#1f4a27' : '#2f6b3a') + '" stroke="#fff" stroke-width="2" d="M15 1C7.3 1 1 7.2 1 14.8 1 25 15 39 15 39s14-14 14-24.2C29 7.2 22.7 1 15 1z"/></svg>'
        + '<span>' + label + '</span></div>'
    });
  }

  // Zoomed out, nearby pins merge into one; zooming in (or clicking a group) splits them apart.
  const groups = L.markerClusterGroup({
    maxClusterRadius: 60,
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true,
    iconCreateFunction: cluster => {
      const total = cluster.getAllChildMarkers().reduce((sum, m) => sum + m.options.count, 0);
      return pinIcon(total, true);
    }
  }).addTo(map);

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  fetch(DATA_URL).then(r => r.json()).then(data => {
    const places = data.places || {};
    let pins = 0, people = 0;
    Object.entries(data.zips || {}).forEach(([zip, count]) => {
      const p = places[zip];
      if (!p) return; // not a Florida zip
      pins++; people += count;
      const label = count === 1 ? '1 Living Landscape' : count + ' Living Landscapes';
      L.marker([p[0], p[1]], { icon: pinIcon(count), count: count, title: zip + ': ' + label, alt: label })
        .bindPopup('<strong>' + label + '</strong><br>' + esc(p[2]) + ', FL ' + esc(zip))
        .addTo(groups);
    });
    document.getElementById('summary').innerHTML =
      '<span><strong>' + people.toLocaleString() + '</strong> Living Landscapes</span>' +
      '<span>in <strong>' + pins.toLocaleString() + '</strong> Florida zip codes</span>' +
      '<span class="muted">Pins mark the center of each zip code, not individual homes.</span>';
  }).catch(err => {
    console.error(err);
    document.getElementById('summary').textContent = 'The map data could not be loaded right now. Please try again later.';
  });
</script>
</body>
</html>
